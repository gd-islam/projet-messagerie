protocols = imap lmtp
mail_location = maildir:/var/mail/vhosts/%d/%n

ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </etc/dovecot/certs/mail-a.crt
ssl_key = </etc/dovecot/private/mail-a.key

service imap-login {
	inet_listener imap {
		port = 0
	}

	inet_listener imaps {
		port = 993
		ssl = yes
	}
}

service lmtp {
	unix_listener /var/spool/postfix/private/dovecot-lmtp {
	mode = 0600
        user = postfix
        group = postfix
    }
}
service auth {
    unix_listener /var/spool/postfix/private/auth {
        mode = 0660
        user = postfix
        group = postfix
    }
}
