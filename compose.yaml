services:
  tailscale-a:
    image: tailscale/tailscale:latest
    container_name: tailscale-a
    hostname: node-a
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=node-a
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-a-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  tailscale-b:
    image: tailscale/tailscale:latest
    container_name: tailscale-b
    hostname: node-b
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=node-b
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-b-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  bind9:
    image: ubuntu/bind9:latest
    container_name: bind9
    volumes:
      - ./config/bind9/named.conf:/etc/bind/named.conf:ro
      - ./config/bind9/named.conf.options:/etc/bind/named.conf.options:ro
      - ./config/bind9/named.conf.local:/etc/bind/named.conf.local:ro
      - ./config/bind9/db.organisation-a.test:/var/lib/bind/db.organisation-a.test:ro
    network_mode: "service:tailscale-a"
    depends_on: [tailscale-a]
    restart: unless-stopped

  mail-a:
    image: organisation-a-mail:1.0
    container_name: mail-a
    network_mode: "service:tailscale-a"
    depends_on:
      - tailscale-a
    volumes:
      - ./config/postfix/main.cf:/etc/postfix/main.cf:ro
      - ./config/postfix/maps:/etc/postfix/maps
      - ./config/postfix/master.cf:/etc/postfix/master.cf:ro
      - ./config/dovecot/10-auth.conf:/etc/dovecot/conf.d/10-auth.conf:ro
      - ./config/dovecot/99-project.conf:/etc/dovecot/conf.d/99-project.conf:ro
      - ./config/dovecot/users:/etc/dovecot/users:ro
      - ./data/mail:/var/mail/vhosts
      - ./certs/mail-a/mail-a.crt:/etc/dovecot/certs/mail-a.crt:ro
      - ./certs/mail-a/mail-a.key:/etc/dovecot/private/mail-a.key:ro
      - ./certs/mail-a/mail-a.crt:/etc/postfix/mail-a.crt:ro
      - ./certs/mail-a/mail-a.key:/etc/postfix/mail-a.key:ro
    restart: unless-stopped

volumes:
  tailscale-a-state:
  tailscale-b-state:
